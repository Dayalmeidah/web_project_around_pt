<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta content="ie=edge" http-equiv="X-UA-Compatible" />
  <title>Around The U.S.</title>
  <link rel="icon" href="./src/images/logo.svg" type="image/svg+xml" />
  <link href="./src/pages/index.css" rel="stylesheet" />
</head>

<body class="page">
  <div class="page__content">
    <header class="header page__section">
      <img alt="Logotipo Around The U.S." class="logo header__logo" src="./src/images/logo.svg" />
    </header>

    <main class="content">
      <section class="profile page__section">
        <div class="profile__image-container">
          <img class="profile__image" src="./src/images/avatar.jpg" alt="Avatar" />
          <button aria-label="Alterar foto do perfil" class="profile__avatar-button" type="button"></button>
        </div>
        <div class="profile__info">
          <h1 class="profile__title">Jacques Cousteau</h1>
          <button aria-label="Editar perfil" class="profile__edit-button" type="button"></button>
          <p class="profile__description">Explorador</p>
        </div>
        <button aria-label="Adicionar cartão" class="profile__add-button" type="button"></button>
      </section>

      <section class="cards page__section">
        <ul class="cards__list">
        </ul>
      </section>

      <template id="card-template">
        <li class="card">
          <img class="card__image" src="" alt="" />
          <button aria-label="Excluir cartão" class="card__delete-button" type="button"></button>
          <div class="card__description">
            <h2 class="card__title"></h2>
            <button aria-label="Botão de curtir" class="card__like-button" type="button"></button>
          </div>
        </li>
      </template>
    </main>

    <footer class="footer page__section">
      <p class="footer__copyright">© 2025 Around The U.S.</p>
    </footer>

    <!-- Pop-up de Editar Perfil -->
    <div class="popup" id="edit-popup">
      <div class="popup__content">
        <button aria-label="Fechar pop-up" class="popup__close" type="button"></button>
        <h3 class="popup__title">Editar perfil</h3>
        <form class="popup__form" id="edit-profile-form" novalidate>
          <div class="popup__field">
            <input class="popup__input popup__input_type_name" name="name" id="name-input" placeholder="Nome"
              type="text" required minlength="2" maxlength="40" />
            <span class="popup__error" id="name-input-error"></span>
          </div>

          <div class="popup__field">
            <input class="popup__input popup__input_type_description" name="about" id="description-input"
              placeholder="Sobre mim" type="text" required minlength="2" maxlength="200" />
            <span class="popup__error" id="description-input-error"></span>
          </div>

          <button class="button popup__button" type="submit">Salvar</button>
        </form>
      </div>
    </div>

    <!-- Pop-up de Adicionar Novo Cartão -->
    <div class="popup" id="new-card-popup">
      <div class="popup__content">
        <button aria-label="Fechar pop-up" class="popup__close" type="button"></button>

        <h3 class="popup__title">Novo local</h3>
        <form class="popup__form" id="new-card-form" novalidate>
          <div class="popup__field">
            <input class="popup__input popup__input_type_card-name" name="name" id="card-title-input"
              placeholder="Título" type="text" required minlength="2" maxlength="30" />
            <span class="popup__error" id="card-title-input-error"></span>
          </div>

          <div class="popup__field">
            <input class="popup__input popup__input_type_url" name="link" id="card-url-input" type="url" required />
            <span class="popup__error" id="card-url-input-error"></span>
          </div>

          <button class="button popup__button" type="submit">Criar</button>
        </form>
      </div>
    </div>

    <!-- Pop-up de Visualização de Imagem -->
    <div class="popup" id="image-popup">
      <div class="popup__content popup__content_content_image">
        <button aria-label="Fechar pop-up" class="popup__close" type="button"></button>
        <img alt="" class="popup__image" src="#" />
        <p class="popup__caption"></p>
      </div>
    </div>

    <!-- Pop-up de Confirmação de Exclusão -->
    <div class="popup popup_type_confirm" id="confirm-popup">
      <div class="popup__content">
        <button aria-label="Fechar pop-up" class="popup__close" type="button"></button>
        <h3 class="popup__title">Tem certeza?</h3>
        <form class="popup__form" id="confirm-form" novalidate>
          <button class="button popup__button" type="submit">Sim</button>
        </form>
      </div>
    </div>

    <!-- Pop-up de Atualização do Avatar -->
    <div class="popup popup_type_avatar" id="avatar-popup">
      <div class="popup__content">
        <button aria-label="Fechar pop-up" class="popup__close" type="button"></button>
        <h3 class="popup__title">Alterar a foto do perfil</h3>
        <form class="popup__form" id="avatar-form" novalidate>
          <div class="popup__field">
            <input class="popup__input popup__input_type_url" name="avatar" id="avatar-url-input"
              placeholder="Link da foto de perfil" type="url" required />
            <span class="popup__error" id="avatar-url-input-error"></span>
          </div>
          <button class="button popup__button" type="submit">Salvar</button>
        </form>
      </div>
    </div>

  </div>
  <script type="module" src="./src/pages/index.js"></script>
</body>

</html>
